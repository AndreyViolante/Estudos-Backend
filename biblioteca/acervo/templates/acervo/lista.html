<!DOCTYPE html>
<html>
<head>
    <title>Acervo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { color: #333; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background: green; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; text-decoration: none; }
        .btn:hover { background: darkgreen; }
        .search-form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-form input, .search-form select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .livro { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 4px; background: #fafafa; }
        .livro h3 { color: #333; margin-bottom: 8px; }
        .livro p { color: #666; margin: 5px 0; font-size: 14px; }
        .badge { display: inline-block; background: #e3f2fd; color: #1976d2; padding: 4px 8px; border-radius: 3px; margin-right: 8px; font-size: 12px; }
        .vazio { text-align: center; color: #999; padding: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Acervo</h1>
            <a href="{% url 'novo' %}" class="btn">+ Novo Livro</a>
        </div>
        
        <form method="get" class="search-form">
            <input type="text" name="nome" placeholder="Pesquisar por nome do livro">
            <select name="tipo">
                <option value="">Todos os tipos</option>
                <option value="digital">Digital</option>
                <option value="fisico">Físico</option>
            </select>
            <select name="categoria">
                <option value="">Todas as categorias</option>
                <option value="000">000 – Generalidades</option>
                <option value="100">100 – Filosofia</option>
                <option value="200">200 – Religião</option>
                <option value="300">300 – Ciências Sociais</option>
                <option value="400">400 – Linguística</option>
                <option value="500">500 – Ciências Puras</option>
                <option value="600">600 – Ciências Aplicadas</option>
                <option value="700">700 – Artes</option>
                <option value="800">800 – Literatura</option>
                <option value="900">900 – História</option>
            </select>
            <button type="submit" class="btn">Pesquisar</button>
        </form>
        
        <p><strong>{{ livros.count }} livro(s) encontrado(s)</strong></p>
        
        {% for livro in livros %}
            <div class="livro">
                <h3>{{ livro.titulo }}</h3>
                <p><strong>Autor:</strong> {{ livro.autor }} ({{ livro.ano }})</p>
                <p>
                    <span class="badge">{{ livro.get_tipo_acervo_display }}</span>
                    <span class="badge">{{ livro.get_categoria_display }}</span>
                </p>
            </div>
        {% empty %}
            <div class="vazio">
                <p>Nenhum livro encontrado.</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
